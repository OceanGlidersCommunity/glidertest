[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=42",
  "setuptools-scm[toml]>=3.4",
  "wheel",
]

[project]
name = "glidertest"
description = "Diagnostic tests of glider quality "
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Callum Rollo", email = "c.rollo@outlook.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [
  "version",
]
dependencies = [
  "cartopy",
  "cmocean",
  "folium",
  "gsw",
  "h5netcdf",
  "h5py",
  "ioos-qc",
  "ipython",
  "ipywidgets",
  "jinja2",
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "pooch",
  "pypandoc",
  "rstcloth",
  "scipy",
  "seaborn",
  "sgp4>=2.14",
  "skyfield",
  "tqdm",
  "xarray",
]
optional-dependencies.dev = [
  "jupyterlab",
  "nbconvert",
  "nbsphinx",
  "pytest",
  "pytest-cov",
  "pytest-socket",
  "sphinx<8.2",
  "sphinx-rtd-theme",
]
urls.documentation = "https://oceangliderscommunity.github.io/glidertest/"
urls.homepage = "https://github.com/OceanGlidersCommunity/glidertest"
urls.repository = "https://github.com/OceanGlidersCommunity/glidertest"
scripts.glidertest = "glidertest.cli:main"

[tool.setuptools]
packages = [
  "glidertest",
  "glidertest.config",
  "glidertest.reports",
]
include-package-data = true

[tool.setuptools.package-data]
"glidertest.config" = [
  "*.mplstyle",
]
"glidertest.reports" = [
  "templates/*.html",
]

[tool.setuptools.dynamic]
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools_scm]
write_to = "glidertest/_version.py"
write_to_template = "__version__ = '{version}'"
tag_regex = "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"

[tool.check-manifest]
ignore = [
  "docs",
  "docs/*",
  "notebooks",
  "notebooks/*",
  "tests",
  "tests/*",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
markers = [
  "slow: full-sample or multi-render tests; excluded from the fast suite with -m 'not slow'",
  "e2e: end-to-end CLI render smoke tests, run on every OS",
]
